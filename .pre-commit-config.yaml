exclude: '^docs/conf.py'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: check-added-large-files
  - id: check-ast
  - id: check-json
  - id: check-merge-conflict
    # An RST title is underlined with a row of "=", which this hook reads as the
    # "=======" that git writes between the two sides of a conflict. It scans the
    # whole tree whenever a merge is in progress, so every merge commit is blocked
    # by docs/license.rst, whose title happens to be exactly seven characters long.
    exclude: ^docs/license\.rst$
  - id: check-xml
  - id: check-yaml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: requirements-txt-fixer
  - id: mixed-line-ending
    args: ['--fix=auto']

- repo: local
  hooks:
    - id: isort
      name: isort
      language: system
      entry: uv run isort .
      require_serial: true
      types_or: [cython, pyi, python]

- repo: local
  hooks:
    - id: black
      name: black (code formatting)
      language: system
      entry: uv run black
      types: [python]

- repo: local
  hooks:
    - id: flake8
      name: flake8 (code linting)
      language: system
      entry: uv run flake8
      types: [python]

- repo: local
  hooks:
  - id: mypy
    name: mypy (static typing)
    pass_filenames: false
    language: system
    # With the s2 extra, so that the S2 message types are there to check against.
    entry: uv run --extra s2 poe type-check
    verbose: true

- repo: local
  hooks:
    - id: no-image-files
      name: Block image files from being committed
      language: fail
      entry: >-
        Image files must not be committed to this repo (they bloat .git forever).
        Put screenshots in the FlexMeasures/screenshots repo, or leave them
        untracked and attach them to the PR/issue manually.
      files: '\.(png|jpe?g|gif|bmp|tiff?|webp|ico|psd)$'
    - id: no-print-in-unattended-code
      name: No print() in code that runs unattended
      # A CEM's handlers run for days without anyone watching standard output,
      # so what they have to say goes to the log, where a deployment keeps it.
      # The example scripts print on purpose, and so do the client's interactive confirmations, which live outside s2/.
      # Matched anywhere on a line, not only at its start, and with a space before the parenthesis too,
      # so that `if x: print(...)`, `return print(...)`, `print (...)`, pprint and writes to stdout or stderr are caught.
      language: pygrep
      entry: '\b(print|pprint)\s*\(|sys\.std(out|err)\.write'
      files: '^src/flexmeasures_client/s2/.*\.py$'
      exclude: '^src/flexmeasures_client/s2/script/'
