# ------------------------------------------------------------------
# A FlexMeasures stack with one S2 CEM per simulated home,
# for a co-simulation whose resource managers connect over websockets,
# such as the community simulations that steer several homes at once.
#
# It is an overlay on FlexMeasures' own docker-compose.yml,
# and runs FlexMeasures from the flexmeasures checkout and the CEMs from this one, both mounted.
# With checkouts named flexmeasures and flexmeasures-client side by side,
# run it from the flexmeasures folder, which holds the Dockerfile:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f ../flexmeasures-client/examples/S2-co-simulation/docker-compose.cem.yml \
#     up
#
# Resource managers connect to ws://localhost:8080/ws, ws://localhost:8081/ws and so on, one per home.
# Each gets a site of its own, named after it,
# and the CEM goes by the simulated time its messages carry (see README.md).
# ------------------------------------------------------------------

# Shared definition for every CEM.
# Each listens on port 8080 inside its own container; only the host port differs.
x-cem: &cem
  build:
    context: .
    dockerfile: Dockerfile
  image: flexmeasures-client-cem
  depends_on:
    - server
  restart: always
  environment:
    FLEXMEASURES_BASE_URL: http://server:5000
    FLEXMEASURES_USER: toy-user@flexmeasures.io
    FLEXMEASURES_PASSWORD: toy-password
    LOGGING_LEVEL: INFO
    # A resource manager in a co-simulation wraps each message with the simulated time.
    S2_ACCEPT_SIMULATION_METADATA: "1"
    # And each home is a site of its own, rather than all of them sharing one.
    S2_SITE_PER_RESOURCE_MANAGER: "1"
  volumes:
    - ../flexmeasures-client:/app/flexmeasures-client:rw
  entrypoint: ["/bin/sh", "-c"]
  command:
  - |
    # Install and run with the same interpreter (`python3 -m pip`, not bare `pip`):
    # in images built from FlexMeasures' uv-based Dockerfile, `python3` is the /app/.venv virtualenv,
    # which may come without pip, and cannot see what the system pip installs.
    python3 -m pip --version >/dev/null 2>&1 || python3 -m ensurepip --upgrade
    # s2-python as this repo locks it, and as the co-simulation's resource managers use it.
    # The checkout may be mounted without git history to read its version from, as a git worktree is,
    # so a version is given, in the plain variable, since hatch-vcs cannot match the per-distribution one.
    SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0 python3 -m pip install --break-system-packages -e "/app/flexmeasures-client[s2]" "s2-python==0.8.1"
    exec python3 /app/flexmeasures-client/src/flexmeasures_client/s2/script/websockets_server.py

# Shared definition for every RQ worker: one per home simulated at once,
# like the CEMs and the server's gunicorn workers below,
# since every home's scheduling jobs otherwise queue behind one worker process.
x-worker: &worker
  # Self-contained, since worker-2 and worker-3 do not exist in the base file to merge with.
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    - dev-db
    - queue-db
    - mailhog
  restart: on-failure
  volumes:
    - ./flexmeasures-instance/:/usr/var/flexmeasures-instance/:rw
    - ../flexmeasures/flexmeasures:/app/flexmeasures:rw
    - ./flexmeasures-instance/:/app/instance/:rw
    - ../flexmeasures-client:/app/flexmeasures-client:rw
  entrypoint: ["/bin/sh", "-c"]
  environment:
    SQLALCHEMY_DATABASE_URI: "postgresql://fm-dev-db-user:fm-dev-db-pass@dev-db:5432/fm-dev-db"
    FLEXMEASURES_REDIS_URL: queue-db
    FLEXMEASURES_REDIS_PASSWORD: fm-redis-pass
    SECRET_KEY: notsecret
    SECURITY_TOTP_SECRETS: '{"1": "something-secret"}'
    FLEXMEASURES_ENV: development
    MAIL_SERVER: mailhog
    MAIL_PORT: 1025
    LOGGING_LEVEL: INFO
  command:
    - |
      # Into the image's virtualenv, which FlexMeasures and its plugins run from, with that interpreter's own pip.
      python3 -m pip --version >/dev/null 2>&1 || python3 -m ensurepip --upgrade
      python3 -m pip install -r /usr/var/flexmeasures-instance/requirements.txt
      # The checkout may be mounted without git history to read its version from, as a git worktree is,
      # so a version is given, in the plain variable, since hatch-vcs cannot match the per-distribution one.
      SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0 python3 -m pip install -e "/app/flexmeasures-client[s2]"
      # Drop any lingering registration for the ingestion queue before this worker starts.
      # FlexMeasures ingests posted sensor data asynchronously when Redis lists a worker for that queue,
      # and a dead worker's entry counts too: posts then wait on a queue nobody serves, and a run hangs without an error.
      # No worker here serves that queue, so removing those entries on every start is safe, and idempotent.
      python3 - <<'PYGUARD'
      import os, redis
      r = redis.Redis(host=os.environ.get("FLEXMEASURES_REDIS_URL", "queue-db"),
                      port=int(os.environ.get("FLEXMEASURES_REDIS_PORT", 6379)),
                      password=os.environ.get("FLEXMEASURES_REDIS_PASSWORD"))
      try:
          for name in r.smembers("rq:workers"):
              key = name.decode()
              queues = (r.hget(key, "queues") or b"").decode()
              if "ingestion" in queues or not queues:
                  r.srem("rq:workers", name); r.delete(key)
          r.delete("rq:workers:ingestion")
      except redis.RedisError as exc:
          print(f"ingestion-registration guard skipped: {exc}")
      PYGUARD
      # Named after the container, which is unique per worker.
      # Every queue the base file's worker serves but ingestion, which is left to the server to do as it receives the data.
      flexmeasures jobs run-worker --name "flexmeasures-worker-$$(hostname)" --queue scheduling\|forecasting\|reporting

services:
  dev-db:
    ports:
      - "5433:5432"
  queue-db:
    ports:
      - "6380:6379"
  server:
    environment:
      # The CEMs reach the server by its service name, which a development server does not trust by default.
      TRUSTED_HOSTS: "localhost,.localhost,127.0.0.1,[::1],server"
    volumes:
      - ./flexmeasures-instance/:/usr/var/flexmeasures-instance/:rw
      - ./flexmeasures-instance/:/app/instance/:rw
      - ../flexmeasures/flexmeasures:/app/flexmeasures:rw
      - ../flexmeasures-client:/app/flexmeasures-client:rw
    command:
      - |
        # Into the image's virtualenv, which FlexMeasures and its plugins run from, with that interpreter's own pip.
        python3 -m pip --version >/dev/null 2>&1 || python3 -m ensurepip --upgrade
        python3 -m pip install -r /usr/var/flexmeasures-instance/requirements.txt
        # The checkout may be mounted without git history to read its version from, as a git worktree is,
        # so a version is given, in the plain variable, since hatch-vcs cannot match the per-distribution one.
        SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0 python3 -m pip install -e "/app/flexmeasures-client[s2]"
        flexmeasures db upgrade
        if ! flexmeasures show accounts | grep -q "Docker Toy Account"; then
            flexmeasures add toy-account --name 'Docker Toy Account'
        fi
        # Worker processes rather than threads: a slow, CPU-bound request held its worker's GIL,
        # and under several threads that starved the other requests into client-side timeouts.
        # One worker per CEM below, since every home's CEM can be mid-request at once;
        # scale the two together.
        gunicorn --bind 0.0.0.0:5000 --worker-tmp-dir /dev/shm --workers 5 --threads 1 --timeout 120 wsgi:application
  # One worker per home simulated at once; add or remove them along with the CEMs.
  worker:
    <<: *worker
  worker-2:
    <<: *worker
  worker-3:
    <<: *worker
  # One CEM per simulated home; add one by copying an entry and taking the next host port.
  cem:
    <<: *cem
    ports:
      - "8080:8080"
  cem-2:
    <<: *cem
    ports:
      - "8081:8080"
  cem-3:
    <<: *cem
    ports:
      - "8082:8080"
  cem-4:
    <<: *cem
    ports:
      - "8083:8080"
  cem-5:
    <<: *cem
    ports:
      - "8084:8080"
